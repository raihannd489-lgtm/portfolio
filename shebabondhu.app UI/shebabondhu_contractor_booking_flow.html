
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif}
  .wrap{display:flex;flex-direction:column;align-items:center;padding:1rem 0 2rem;gap:16px}
  .stepper{display:flex;align-items:center;gap:0;width:340px}
  .step-node{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
  .step-circle{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;border:1.5px solid #ccc;color:#aaa;background:#fff;transition:all 0.2s;cursor:pointer}
  .step-circle.done{background:#1B6B4A;border-color:#1B6B4A;color:#fff}
  .step-circle.active{background:#fff;border-color:#1B6B4A;color:#1B6B4A}
  .step-lbl{font-size:7.5px;color:#aaa;text-align:center;line-height:1.3;transition:color 0.2s}
  .step-lbl.active{color:#1B6B4A;font-weight:500}
  .step-lbl.done{color:#1B6B4A}
  .step-line{flex:1;height:1.5px;background:#ddd;margin-bottom:14px;transition:background 0.2s}
  .step-line.done{background:#1B6B4A}
  .phone{background:#1a1a1a;border-radius:36px;padding:10px;width:200px}
  .screen{background:#FFF8ED;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;font-family:'Segoe UI',Arial,sans-serif;min-height:400px}
  .sbar{background:#1B6B4A;height:18px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
  .stime{font-size:8px;color:#fff;opacity:.9}
  .sdots{display:flex;gap:3px}
  .sd{width:4px;height:4px;border-radius:50%;background:#fff;opacity:.8}
  .hdr{background:#1B6B4A;padding:8px 10px 10px}
  .hdr-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .back-btn{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .hdr-title{font-size:10px;font-weight:500;color:#fff;flex:1}
  .hdr-step{font-size:8px;color:#9FE1CB}
  .progress-bar{height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:6px}
  .progress-fill{height:100%;background:#F59E0B;border-radius:2px;transition:width .3s}
  .body{flex:1;padding:10px;overflow:hidden;display:flex;flex-direction:column;gap:8px}
  .sec-title{font-size:8.5px;font-weight:500;color:#1B6B4A;margin-bottom:2px}
  .card{background:#fff;border-radius:10px;padding:8px 10px;border:.5px solid #E8E0D0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .lbl{font-size:8px;color:#888}
  .val{font-size:8.5px;color:#222;font-weight:500}
  .chip{background:#EAF3DE;color:#27500A;font-size:7px;padding:2px 7px;border-radius:10px;font-weight:500}
  .chip-amber{background:#FEF3C7;color:#78350F}
  .chip-blue{background:#EFF6FF;color:#0C447C}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .opt{background:#fff;border-radius:8px;padding:7px 8px;border:.5px solid #E8E0D0;cursor:pointer;transition:border-color .15s}
  .opt.sel{border:1.5px solid #1B6B4A;background:#EAF3DE}
  .opt-title{font-size:8px;font-weight:500;color:#222;margin-bottom:2px}
  .opt-sub{font-size:7px;color:#888}
  .inp-row{display:flex;flex-direction:column;gap:3px}
  .inp-lbl{font-size:8px;color:#555;font-weight:500}
  .fake-inp{background:#fff;border:.5px solid #D0C8B8;border-radius:7px;padding:6px 8px;font-size:8px;color:#888}
  .fake-inp.filled{color:#222}
  .big-btn{background:#1B6B4A;color:#fff;border-radius:10px;padding:10px;text-align:center;font-size:9px;font-weight:500;cursor:pointer;margin-top:auto}
  .big-btn-amber{background:#F59E0B;color:#412402}
  .divider{height:.5px;background:#E8E0D0;margin:2px 0}
  .avatar-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;flex-shrink:0}
  .star-row{color:#F59E0B;font-size:8px;letter-spacing:1px}
  .tag-row{display:flex;gap:4px;flex-wrap:wrap}
  .success-circle{width:52px;height:52px;border-radius:50%;background:#EAF3DE;border:2px solid #1B6B4A;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
  .summary-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:.5px solid #F0EAE0;font-size:8px}
  .summary-row:last-child{border-bottom:none}
  .sum-key{color:#888}
  .sum-val{color:#222;font-weight:500}
  .nav-btn-row{display:flex;gap:8px;width:100%;justify-content:center}
  .nav-btn{padding:8px 22px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:500;border:1.5px solid #1B6B4A;color:#1B6B4A;background:#fff}
  .nav-btn.primary{background:#1B6B4A;color:#fff;border-color:#1B6B4A}
  .screen-lbl{font-size:11px;color:var(--color-text-tertiary);text-align:center;margin-top:6px}
</style>

let cur=0;
function selOpt(id,...others){
  document.getElementById(id)?.classList.add('sel');
  others.forEach(o=>document.getElementById(o)?.classList.remove('sel'));
}
function renderStepper(){
  const s=document.getElementById('stepper');
  s.innerHTML='';
  steps.forEach((st,i)=>{
    const nd=document.createElement('div');nd.className='step-node';
    nd.innerHTML=`<div class="step-circle ${i<cur?'done':i===cur?'active':''}" onclick="jump(${i})">${i<cur?'✓':i+1}</div><div class="step-lbl ${i<cur?'done':i===cur?'active':''}">${st.label.replace('\n','<br>')}</div>`;
    s.appendChild(nd);
    if(i<steps.length-1){const ln=document.createElement('div');ln.className='step-line '+(i<cur?'done':'');s.appendChild(ln);}
  });
}
function renderScreen(){
  document.getElementById('screen').innerHTML=screens[cur]();
  document.getElementById('slbl').textContent=['A — প্রকল্পের ধরন','B — কাজের বিবরণ','C — ঠিকাদার বাছাই','D — সময় ও পেমেন্ট','E — বুকিং নিশ্চিত'][cur];
  document.getElementById('prevBtn').style.opacity=cur===0?'0.3':'1';
  document.getElementById('prevBtn').style.pointerEvents=cur===0?'none':'auto';
  document.getElementById('nextBtn').textContent=cur===steps.length-1?'পুনরায় শুরু ↺':'পরের ধাপ →';
}
function go(d){
  if(d===1&&cur===steps.length-1){cur=0;}
  else{cur=Math.max(0,Math.min(steps.length-1,cur+d));}
  renderStepper();renderScreen();
}
function jump(i){cur=i;renderStepper();renderScreen();}
renderStepper();renderScreen();
</script>
